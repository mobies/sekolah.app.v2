name = "sekolah-app"
compatibility_date = "2024-04-03"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".next"

[[durable_objects.bindings]]
name = "WALLET_DO"
class_name = "WalletDurableObject"

[[queues.producers]]
queue = "attendance-queue"
binding = "ATTENDANCE_QUEUE"

[[r2_buckets]]
binding = "SCHOOL_ASSETS"
bucket_name = "school-assets-bucket"

[vars]
# TURSO_AUTH_TOKEN and other secrets should be set via wrangler secret put
TURSO_ORG_NAME = "my-org"

[build]
command = "npm run build"
watch_dir = "src"
